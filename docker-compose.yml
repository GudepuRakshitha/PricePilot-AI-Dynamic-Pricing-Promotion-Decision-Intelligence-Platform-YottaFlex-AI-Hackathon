version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pricepilot-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/pricepilot_ai
      - AUTO_SEED=true
      - SECRET_KEY=pricepilot-dev-secret-key-change-me
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=604800
      - REFRESH_TOKEN_EXPIRE_MINUTES=2592000
      - BCRYPT_ROUNDS=12
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - COMPETITOR_FRESHNESS_DAYS=7
      - AS_OF_DATE=2026-01-31
      - MIN_PROFIT_MARGIN_PCT=25.04
      - MAX_PROFIT_MARGIN_PCT=60.0
      - PRICE_FLOOR_BUFFER_PCT=0.0
      - PRICE_CEILING_BUFFER_PCT=0.0
      - STALE_DEVIATION_THRESHOLD_PCT=10.0
      - DEMAND_HIGH_MULTIPLIER=1.08
      - DEMAND_MEDIUM_MULTIPLIER=1.0
      - DEMAND_LOW_MULTIPLIER=0.95
      - INVENTORY_DISCOUNT_MAX_PCT=15.0
      - INVENTORY_OVERSTOCK_MULTIPLIER=0.9
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pricepilot-frontend
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  db:
    image: postgres:18-alpine
    container_name: pricepilot-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=pricepilot_ai
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: